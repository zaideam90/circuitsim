<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E2A32">

<title>Electrical Control Circuit Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#ECEEEA;--ink:#1E2A32;--ink-soft:#4C5A64;--line:#C9CEC8;--l1:#D8322A;--l2:#B8860B;--l3:#5F3DC4;--neutral:#2A64B0;--dead:#8A9299;--panel:#F7F8F6;--sel:#E9A400;--ok:#2E7D4F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
  #app{display:grid;grid-template-rows:52px 1fr 30px;grid-template-columns:215px 1fr 280px;height:100vh}
  header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow:hidden}
  header h1{font-size:15px;font-weight:600;white-space:nowrap}
  header h1 span{font-weight:400;color:var(--ink-soft);font-size:12px;margin:0 6px}
  button,select.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--ink-soft)}
  button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;min-width:84px}
  button.primary.running{background:var(--l1);border-color:var(--l1)}
  button.accent{background:#FFF4D6;border-color:var(--sel)}
  button[hidden],span[hidden]{display:none}
  .spacer{flex:1}
  aside{background:var(--panel);overflow-y:auto;padding:12px}
  #palette{border-inline-end:1px solid var(--line)}
  #props{border-inline-start:1px solid var(--line);display:flex;flex-direction:column}
  aside h2{font-size:12px;font-weight:600;color:var(--ink-soft);margin:12px 0 6px}
  aside h2:first-child{margin-top:0}
  .tool{display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px;margin-bottom:2px;background:transparent;border:1px solid transparent;text-align:start;border-radius:4px}
  .tool:hover{background:#fff;border-color:var(--line)}
  .tool.active{background:#fff;border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
  .tool svg{width:44px;height:24px;flex:none}
  .tool svg *{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round}
  .tool span{font-size:12.5px}
  #stage{position:relative;overflow:hidden;background:var(--paper)}
  canvas{display:block;cursor:crosshair}
  canvas.select{cursor:default} canvas.run{cursor:default} canvas.meter{cursor:cell}
  footer{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:12px;color:var(--ink-soft);background:var(--panel);border-top:1px solid var(--line)}
  footer .warn{color:var(--l1);font-weight:600} footer .ok{color:var(--ok);font-weight:600}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:2px}
  .field input,.field select{width:100%;font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
  .field input:focus{outline:2px solid var(--sel);border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .hint{font-size:12px;color:var(--ink-soft);line-height:1.7}
  .hint kbd{font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:11px}
  .danger{color:var(--l1);border-color:#F1C4C0}
  #legend{display:flex;gap:8px;align-items:center;font-size:11px;white-space:nowrap}
  #legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin:0 3px;border-radius:2px}
  #log{font-size:12px;line-height:1.55;flex:1;min-height:110px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 8px;overflow-y:auto}
  #log div{padding:2px 0;border-bottom:1px dashed #EEE}
  #log .t{color:var(--ink-soft);font-size:11px;margin:0 4px}
  #log .fault{color:var(--l1)} #log .good{color:var(--ok)}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin:4px 0}
  .exbox{background:#FFF4D6;border:1px solid var(--sel);border-radius:4px;padding:8px;font-size:12px;line-height:1.6;margin-bottom:8px}
  input[type=file]{display:none}

/* ---------- mobile / narrow screens ---------- */
#menuBtn,#propBtn{display:none}
@media (max-width: 900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr 28px}
  header{flex-wrap:nowrap;overflow-x:auto;padding:6px 8px;gap:6px;height:auto;-webkit-overflow-scrolling:touch}
  header h1 span,#legend,.spacer{display:none}
  header h1{font-size:13px}
  #menuBtn,#propBtn{display:inline-block}
  aside{position:fixed;top:0;bottom:0;width:min(85vw,320px);z-index:20;box-shadow:0 0 24px rgba(0,0,0,.25);transition:transform .2s;padding-top:14px}
  #palette{left:0;transform:translateX(-105%)}
  #props{right:0;transform:translateX(105%)}
  [dir=rtl] #palette{left:auto;right:0;transform:translateX(105%)}
  [dir=rtl] #props{right:auto;left:0;transform:translateX(-105%)}
  aside.open{transform:none !important}
  aside .closeX{display:block;position:absolute;top:6px;inset-inline-end:8px;font-size:18px;background:none;border:none;color:var(--ink-soft)}
  #stage{grid-column:1;grid-row:2}
  footer{grid-column:1;font-size:11px;padding:0 8px;gap:8px;white-space:nowrap;overflow:hidden}
  .tool{padding:8px 8px}
  button{padding:8px 10px}
}
aside .closeX{display:none}
#dim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15}
#dim.show{display:block}
canvas{touch-action:none}

</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menuBtn">☰</button>
    <h1 id="ttl">Control Circuit Simulator<span id="sub">single &amp; three-phase, VFD, DC</span></h1>
    <button class="primary" id="runBtn">▶ Run</button>
    <button id="resetBtn" hidden>Reset protections</button>
    <button class="accent" id="exBtn">Exercise</button>
    <button id="exGuess" hidden>Diagnose</button>
    <button id="exReveal" hidden>Reveal</button>
    <select class="btn" id="exampleSel"></select>
    <button id="clearBtn">New</button>
    <button id="undoBtn" title="Ctrl+Z">↶</button><button id="redoBtn" title="Ctrl+Y">↷</button>
    <button id="fitBtn">Fit</button>
    <div class="spacer"></div>
    <div id="legend"></div>
    <div class="spacer"></div>
    <button id="pngBtn">PNG</button><button id="printBtn">PDF</button><button id="saveBtn">Save</button><button id="loadBtn">Open</button>
    <button id="langBtn">عربي</button>
    <button id="propBtn">⚙</button>
    <input type="file" id="fileIn" accept=".json">
  </header>
  <aside id="palette"></aside>
  <div id="dim"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside id="props">
    <button class="closeX" id="propsClose">✕</button>
    <div id="exPanel" hidden></div>
    <h2 id="hProps">Properties</h2>
    <div id="propsBody" class="hint"></div>
    <label class="chk"><input type="checkbox" id="chkNum"> <span id="lblNum">IEC terminal numbers</span></label>
    <label class="chk"><input type="checkbox" id="chkCol" checked> <span id="lblCol">Live wire colours</span></label>
    <h2 id="hLog">Event log</h2>
    <div id="log"></div>
    <h2 id="hKeys">Shortcuts</h2>
    <div class="hint" id="keys"></div>
  </aside>
  <footer><span id="status">Ready</span><span id="simMsg"></span><span class="spacer"></span><span id="coords"></span></footer>
</div>

// ---------- touch support (single finger = mouse, two fingers = pinch zoom / pan) ----------
(function(){
  let pinch=null;
  const fire=(type,t,extra)=>cv.dispatchEvent(new MouseEvent(type,{clientX:t.clientX,clientY:t.clientY,button:0,buttons:1,bubbles:true,...(extra||{})}));
  cv.addEventListener('touchstart',e=>{ e.preventDefault(); if (e.touches.length===2){ const [a,b]=e.touches; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2,z:view.z,vx:view.x,vy:view.y}; drag=null; return; } fire('mousemove',e.touches[0]); fire('mousedown',e.touches[0]); },{passive:false});
  cv.addEventListener('touchmove',e=>{ e.preventDefault(); if (pinch&&e.touches.length===2){ const [a,b]=e.touches; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2; const r=cv.getBoundingClientRect(); const nz=Math.max(0.25,Math.min(3,pinch.z*d/pinch.d)); const px=pinch.cx-r.left,py=pinch.cy-r.top; view.z=nz; view.x=(cx-r.left)-(px-pinch.vx)*(nz/pinch.z); view.y=(cy-r.top)-(py-pinch.vy)*(nz/pinch.z); draw(); return; } if (e.touches.length===1) fire('mousemove',e.touches[0]); },{passive:false});
  cv.addEventListener('touchend',e=>{ e.preventDefault(); if (pinch){ if (e.touches.length<2) pinch=null; return; } const t=e.changedTouches[0]; window.dispatchEvent(new MouseEvent('mouseup',{clientX:t.clientX,clientY:t.clientY,button:0,bubbles:true})); },{passive:false});
  // long-press = right-click (finish wire / cancel tool)
  let lp=null; cv.addEventListener('touchstart',e=>{ if (e.touches.length===1){ const t=e.touches[0]; lp=setTimeout(()=>{ cv.dispatchEvent(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY,button:2,bubbles:true})); },600); } },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>cv.addEventListener(ev,()=>{ if (lp){ clearTimeout(lp); lp=null; } },{passive:true}));
})();

  } else {
    b.textContent=T('run'); b.classList.remove('running'); document.getElementById('resetBtn').hidden=true;
    for (const w of doc.wires) if(!w.hidden) w.cut=false; for (const c of doc.comps){ if (c.hidden) continue; c.blown=false; c.tripped=false; c.burnt=false; if(isBrk(c.type)||c.type==='rcd2'||c.type==='rcd4') c.on=true; if(c.type==='vfd'||c.type==='softstart'){ c.fault=null; c.running=false; c.freq=0; c.level=0; } if (c.type==='plc'){ c.plcQ=[false,false,false,false,false,false,false,false]; c.plcT=[]; } }
    sim=freshSim(); sparks=[]; cv.className='select'; document.getElementById('simMsg').textContent=''; setStatus(T('ready')); renderProps(); draw();
  }
}
function loop(t){
  if (!running) return; const dt=Math.max(0,Math.min(0.1,(t-lastT)/1000)); lastT=t; simulate(dt);
  const m=document.getElementById('simMsg');
  if (mains.tripped){ m.className='warn'; m.textContent=T('mainsTrip'); } else if (sim.shorts.length){ m.className='warn'; m.textContent=T('short'); } else if (sim.unstable){ m.className='warn'; m.textContent=T('unstable'); }
  else if (!doc.comps.some(c=>TYPES[c.type].kind==='source')){ m.className='warn'; m.textContent=T('noSrc'); } else { m.className='ok'; m.textContent=T('loads',[...sim.loadState.values()].filter(isOn).length); }
  draw(); requestAnimationFrame(loop);
}

// ---------- exercise mode ----------
function faultName(f){ if (!f) return ''; if (f.kind==='cut') return T('fCut'); const c=doc.comps.find(x=>x.id===f.id); return f.kind==='fuse'?T('fFuse',c.label):f.kind==='burnt'?T('fBurnt',c.label):T('fStuck',c.label); }
function startExercise(){
  if (ex.active){ endExercise(); return; }
  if (!doc.comps.length){ setStatus(T('exNeed')); return; }
  if (running) toggleRun();
  const opts=[];
  for (const w of doc.wires) opts.push({kind:'cut',id:w.id});
  for (const c of doc.comps){ if (c.type==='fuse') opts.push({kind:'fuse',id:c.id}); if (['coil','lamp','timer','buzzer','heater'].includes(c.type)) opts.push({kind:'burnt',id:c.id}); if (['k_no','pb_no','pb_nc','k_nc','ol','sw'].includes(c.type)) opts.push({kind:'stuck',id:c.id}); }
  if (!opts.length) return;
  const f=opts[Math.floor(Math.random()*opts.length)];
  if (f.kind==='cut'){ const w=doc.wires.find(x=>x.id===f.id); w.cut=true; w.hidden=true; }
  else { const c=doc.comps.find(x=>x.id===f.id); c.hidden=true; if (f.kind==='fuse') c.blown=true; else if (f.kind==='burnt') c.burnt=true; else c.stuck='open'; }
  ex={active:true,fault:f,guessing:false,done:false};
  document.getElementById('exPanel').hidden=false; document.getElementById('exPanel').innerHTML=`<div class="exbox">${T('exIntro')}</div>`;
  document.getElementById('exGuess').hidden=false; document.getElementById('exReveal').hidden=false; document.getElementById('exBtn').textContent=T('exStop');
  toggleRun();
}
function endExercise(){
  const f=ex.fault;
  if (f){ if (f.kind==='cut'){ const w=doc.wires.find(x=>x.id===f.id); if (w){ w.cut=false; w.hidden=false; } } else { const c=doc.comps.find(x=>x.id===f.id); if (c){ c.hidden=false; c.blown=false; c.burnt=false; c.stuck=null; } } }
  ex={active:false,fault:null,guessing:false,done:false};
  document.getElementById('exPanel').hidden=true; document.getElementById('exGuess').hidden=true; document.getElementById('exReveal').hidden=true; document.getElementById('exBtn').textContent=T('ex');
  if (running) toggleRun(); draw();
}
function exGuess(c,w){
  const f=ex.fault; const ok=(c&&f.kind!=='cut'&&c.id===f.id)||(w&&f.kind==='cut'&&w.id===f.id);
  const p=document.getElementById('exPanel');
  if (ok){ p.innerHTML=`<div class="exbox" style="background:#E3F4E8;border-color:var(--ok)">${T('exRight',faultName(f))}</div>`; ex.guessing=false; ex.done=true; revealFault(); }
  else { p.innerHTML=`<div class="exbox">${T('exIntro')}<br><b style="color:var(--l1)">${T('exWrong')}</b></div>`; ex.guessing=false; }
  setStatus(T('ready')); draw();
}
function revealFault(){ const f=ex.fault; if (!f) return; if (f.kind==='cut'){ const w=doc.wires.find(x=>x.id===f.id); if (w) w.hidden=false; } else { const c=doc.comps.find(x=>x.id===f.id); if (c){ c.hidden=false; if (f.kind==='stuck'){ c.stuck=null; c.burnt=true; } } } draw(); }
document.getElementById('exBtn').onclick=startExercise;
document.getElementById('exGuess').onclick=()=>{ if (!ex.active||ex.done) return; ex.guessing=true; setStatus(T('exGuessHint')); };
document.getElementById('exReveal').onclick=()=>{ if (!ex.active) return; document.getElementById('exPanel').innerHTML=`<div class="exbox">${T('exReveal',faultName(ex.fault))}</div>`; ex.done=true; ex.guessing=false; revealFault(); };
