<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E2A32">
<link rel="manifest" href="manifest.json">
<title>Electrical Control Circuit Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <button id="menuBtn">☰</button>
    <h1 id="ttl">Control Circuit Simulator<span id="sub">single &amp; three-phase, VFD, DC</span></h1>
    <button class="primary" id="runBtn">▶ Run</button>
    <button id="resetBtn" hidden>Reset protections</button>
    <button class="accent" id="exBtn">Exercise</button>
    <button id="exGuess" hidden>Diagnose</button>
    <button id="exReveal" hidden>Reveal</button>
    <select class="btn" id="exampleSel"></select>
    <button id="clearBtn">New</button>
    <button id="undoBtn" title="Ctrl+Z">↶</button><button id="redoBtn" title="Ctrl+Y">↷</button>
    <button id="fitBtn">Fit</button>
    <div class="spacer"></div>
    <div id="legend"></div>
    <div class="spacer"></div>
    <button id="pngBtn">PNG</button><button id="printBtn">PDF</button><button id="saveBtn">Save</button><button id="loadBtn">Open</button>
    <button id="langBtn">عربي</button>
    <button id="propBtn">⚙</button>
    <input type="file" id="fileIn" accept=".json">
  </header>
  <aside id="palette"></aside>
  <div id="dim"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside id="props">
    <button class="closeX" id="propsClose">✕</button>
    <div id="exPanel" hidden></div>
    <h2 id="hProps">Properties</h2>
    <div id="propsBody" class="hint"></div>
    <label class="chk"><input type="checkbox" id="chkNum"> <span id="lblNum">IEC terminal numbers</span></label>
    <label class="chk"><input type="checkbox" id="chkCol" checked> <span id="lblCol">Live wire colours</span></label>
    <h2 id="hLog">Event log</h2>
    <div id="log"></div>
    <h2 id="hKeys">Shortcuts</h2>
    <div class="hint" id="keys"></div>
  </aside>
  <footer><span id="status">Ready</span><span id="simMsg"></span><span class="spacer"></span><span id="coords"></span></footer>
</div>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/catalog.js"></script>
<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/ui.js"></script>
<script src="js/examples.js"></script>
</body>
</html>
